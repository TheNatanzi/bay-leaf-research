<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bay Leaf Venues</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<style>
:root{--bg:#f6f6f4;--card:#fff;--ink:#23262f;--soft:#5d6577;--faint:#a3a9b6;--line:#e2e4e9;--accent:#b3541e;--accentbg:#fbefe7;--good:#2f7d4f;--goodbg:#e8f3ec}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15171c;--card:#1f222a;--ink:#eceef3;--soft:#a9b1c2;--faint:#6b7386;--line:#343946;--accent:#f0a273;--accentbg:#3a2a20;--good:#7fcf9c;--goodbg:#1d3326}}
:root[data-theme="dark"]{--bg:#15171c;--card:#1f222a;--ink:#eceef3;--soft:#a9b1c2;--faint:#6b7386;--line:#343946;--accent:#f0a273;--accentbg:#3a2a20;--good:#7fcf9c;--goodbg:#1d3326}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,Arial,sans-serif;font-size:17px;line-height:1.4}
button,input,select{font:inherit;color:var(--ink)}a{color:var(--accent)}
.top{position:sticky;top:0;z-index:600;background:var(--card);border-bottom:1px solid var(--line)}
.bar{max-width:1280px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar h1{font-size:1.3rem;font-weight:600;margin:0 8px 0 0;white-space:nowrap}
.bar input[type=search]{flex:1 1 240px;min-width:180px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.bar select{padding:10px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);max-width:100%}
.btn{padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;white-space:nowrap}.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chips{max-width:1280px;margin:0 auto;padding:0 16px 10px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;color:var(--soft)}
.chips label{display:flex;gap:6px;align-items:center;cursor:pointer}.chips .count{margin-left:auto;font-weight:600;color:var(--ink)}
.wrap{max-width:1280px;margin:0 auto;padding:14px 16px 40px;display:grid;grid-template-columns:1fr;gap:14px}
body.withmap .wrap{grid-template-columns:minmax(0,1fr) 420px}
.mapbox{display:none;position:sticky;top:130px;height:calc(100vh - 150px);border:1px solid var(--line);border-radius:12px;overflow:hidden}body.withmap .mapbox{display:block}#map{height:100%}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--soft);font-size:.92rem;white-space:nowrap;cursor:pointer;user-select:none;background:var(--card)}th.sorted{color:var(--accent)}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--accentbg)}td.n{white-space:nowrap;font-variant-numeric:tabular-nums}
.nm{font-weight:600}.loc{color:var(--soft);font-size:.93rem}.none{color:var(--faint)}.best{display:inline-block;margin-left:8px;padding:0 8px;border-radius:6px;background:var(--goodbg);color:var(--good);font-size:.82rem;font-weight:600;vertical-align:1px}
.more{display:block;margin:14px auto 0;padding:11px 22px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:900;display:none}.sheetbg.open{display:block}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);z-index:1000;background:var(--card);overflow-y:auto;padding:20px 22px 40px;display:none;box-shadow:-8px 0 30px rgba(0,0,0,.18)}.sheet.open{display:block}
.sheet h2{font-size:1.5rem;font-weight:600;margin:0 50px 2px 0}.sheet .x{position:absolute;top:14px;right:14px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}.acts a{padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);text-decoration:none;color:var(--ink)}.acts a.main{background:var(--accent);border-color:var(--accent);color:#fff}
.glance{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 6px}.cell{border:1px solid var(--line);border-radius:10px;padding:10px 12px}.cell .k{color:var(--soft);font-size:.88rem}.cell .v{font-weight:600;font-size:1.08rem}
.sec{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}.sec h3{font-size:1.05rem;font-weight:600;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sec ul{margin:0;padding-left:20px}.sec li{margin:4px 0}.srcbtn{font-size:.88rem;padding:3px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;color:var(--soft);white-space:nowrap}
.src{display:none;margin:3px 0 8px;padding:6px 10px;border-left:3px solid var(--line);color:var(--soft);font-size:.92rem;overflow-wrap:anywhere}.showsrc .src{display:block}
.note{color:var(--soft);font-size:.94rem}
.leaflet-container{font:inherit}.marker-cluster{background:rgba(179,84,30,.22);border-radius:50%}.marker-cluster div{background:#b3541e;color:#fff;border-radius:50%;width:30px;height:30px;margin:5px;text-align:center;line-height:30px;font-weight:600;font-size:13px}
@media(max-width:900px){.top{position:static}.bar{gap:8px}.bar h1{flex:1 1 100%}.bar input[type=search]{flex:1 1 100%}.bar select,.bar .btn{flex:1 1 calc(50% - 4px);min-width:0}.chips label{flex:1 1 100%}body.withmap .wrap{grid-template-columns:1fr}body.withmap .mapbox{position:relative;top:0;height:60vh;order:-1}
 thead{display:none}table,tbody{display:block;border:0;background:transparent}tbody tr{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
 td{border:0;padding:1px 0}td.first{grid-column:1/3;padding-bottom:6px}td[data-k]::before{content:attr(data-k) ": ";color:var(--soft);font-size:.9rem}td.empty{display:none}.glance{grid-template-columns:1fr 1fr}.chips .count{margin-left:0;width:100%}}
</style>
</head>
<body>
<div class="top">
 <div class="bar"><h1>Bay Leaf venues</h1>
  <input type="search" id="q" placeholder="Search venue, city or address" aria-label="Search">
  <select id="county" aria-label="County"><option value="">All counties</option></select>
  <select id="minG" aria-label="Guests"><option value="">Any size</option><option value="100">100+ guests</option><option value="200">200+ guests</option><option value="300">300+ guests</option><option value="400">400+ guests</option><option value="500">500+ guests</option></select>
  <select id="late" aria-label="Closing time"><option value="">Any closing time</option><option value="1320">Open to 10 PM or later</option><option value="1380">Open to 11 PM or later</option><option value="1440">Open to midnight or later</option></select>
  <select id="cater" aria-label="Catering"><option value="">Any catering</option><option>Outside caterers OK</option><option>Approved list</option><option>In-house only</option><option>In-house available</option></select>
  <button class="btn" id="mapbtn">Show map</button>
 </div>
 <div class="chips">
  <label><input type="checkbox" id="hp"> Price known</label><label><input type="checkbox" id="byo"> Bring your own alcohol</label><label><input type="checkbox" id="ho"> Outdoor space</label>
  <label><input type="checkbox" id="unnamed"> Include <span id="un"></span> unnamed marketplace listings</label>
  <button class="btn" id="reset" style="padding:5px 12px">Clear</button><span class="count" id="count">Loading the venue list</span>
 </div>
</div>
<div class="wrap">
 <div><table><thead><tr><th data-s="rel" class="sorted">Venue</th><th data-s="g">Guests</th><th data-s="p">Price from</th><th data-s="c">Closes</th><th>Catering</th><th>Alcohol</th><th>Outdoor</th></tr></thead><tbody id="tb"></tbody></table>
  <button class="more" id="more">Show more</button></div>
 <div class="mapbox"><div id="map"></div></div>
</div>
<div class="sheetbg" id="bg"></div>
<div class="sheet" id="sheet"><button class="btn x" id="close">Close</button><div id="body"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script>
const TOPIC=[['price','Pricing'],['capacity','Capacity'],['hours','Hours and end time'],['catering','Catering'],['alcohol','Alcohol'],['rental_terms','Rental terms'],['contact','Contact'],['event_space','About the space'],['other','Other']];
const $=id=>document.getElementById(id);let D=[],shown=[],limit=50,sortK='rel',asc=true,map,cluster,markers={},cache={};
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
function passes(r){const q=$('q').value.trim().toLowerCase(),c=$('county').value,g=+$('minG').value||0,l=+$('late').value||0,ca=$('cater').value;
 if(!$('unnamed').checked&&r[24])return false;if(c&&r[3]!==c)return false;if(g&&!(r[7]>=g))return false;if(l&&!(r[18]>=l))return false;if(ca&&r[19]!==ca)return false;
 if($('hp').checked&&!r[9])return false;if($('byo').checked&&r[20]!=='Bring your own')return false;if($('ho').checked&&!r[10])return false;
 if(q&&!(r[1]+' '+r[2]+' '+r[14]).toLowerCase().includes(q))return false;return true}
function cmp(a,b){const last=1e15,dir=asc?1:-1;if(sortK==='g')return ((b[7]||-1)-(a[7]||-1))*dir||b[23]-a[23];
 if(sortK==='p'){const u={event:0,person:1,hour:2};const x=a[16]==null?last:u[a[17]]*1e9+a[16],y=b[16]==null?last:u[b[17]]*1e9+b[16];return (x===last||y===last)?x-y:(x-y)*dir||b[23]-a[23]}
 if(sortK==='c')return ((b[18]||-1)-(a[18]||-1))*dir||b[23]-a[23];return (b[23]-a[23])*dir||a[1].localeCompare(b[1])}
function td(text,key,cls){const t=el('td',cls||'');if(text){t.textContent=text}else{t.textContent='—';t.classList.add('none','empty')}if(key)t.dataset.k=key;return t}
function draw(){const tb=$('tb');tb.textContent='';shown.slice(0,limit).forEach(r=>{const tr=el('tr');const f=el('td','first');const n=el('div','nm',r[1]);if(r[11]===1)n.appendChild(el('span','best','Best match'));
  f.appendChild(n);f.appendChild(el('div','loc',[r[2],r[3]&&r[3]+' County'].filter(Boolean).join(', ')+(r[25]?' · may be closed':'')));tr.appendChild(f);
  tr.appendChild(td(r[7]?'Up to '+r[7].toLocaleString():'','Guests','n'));tr.appendChild(td(r[9],'Price from','n'));tr.appendChild(td(r[8],'Closes','n'));
  tr.appendChild(td(r[19],'Catering'));tr.appendChild(td(r[20],'Alcohol'));tr.appendChild(td(r[10]?'Yes':'','Outdoor'));tr.onclick=()=>openVenue(r);tb.appendChild(tr)});
 $('more').style.display=shown.length>limit?'block':'none';$('more').textContent='Show 50 more ('+(shown.length-limit).toLocaleString()+' left)';
 $('count').textContent=shown.length.toLocaleString()+' venues';drawMap()}
function apply(){shown=D.filter(passes).sort(cmp);limit=50;draw()}
function drawMap(){if(!map||!document.body.classList.contains('withmap'))return;cluster.clearLayers();const ms=[];shown.forEach(r=>{if(r[4]==null)return;let m=markers[r[0]];
 if(!m){const col=r[11]===1?'#2f7d4f':'#b3541e';m=L.circleMarker([r[4],r[5]],{radius:r[11]===1?9:7,color:col,weight:2,fillColor:col,fillOpacity:r[6]?0:.75,dashArray:r[6]?'3 3':null});
  m.bindTooltip(r[1]+(r[6]?' (approximate: city only)':''));m.on('click',()=>openVenue(r));markers[r[0]]=m}ms.push(m)});cluster.addLayers(ms)}
function initMap(){if(map)return;map=L.map('map',{preferCanvas:true}).setView([37.85,-122.25],9);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
 cluster=L.markerClusterGroup({chunkedLoading:true,maxClusterRadius:50,disableClusteringAtZoom:15,iconCreateFunction:c=>L.divIcon({html:'<div>'+c.getChildCount()+'</div>',className:'marker-cluster',iconSize:[40,40]})});map.addLayer(cluster)}
function cell(k,v){const c=el('div','cell');c.appendChild(el('div','k',k));c.appendChild(el('div','v'+(v?'':' none'),v||'Not found yet'));return c}
async function openVenue(r){const B=$('body');B.textContent='';$('sheet').classList.add('open');$('bg').classList.add('open');$('sheet').scrollTop=0;
 B.appendChild(el('h2','',r[1]));B.appendChild(el('div','note',[r[14]||r[2],r[3]&&r[3]+' County'].filter(Boolean).join(' · ')));
 const a=el('div','acts');const link=(t,h,m)=>{const x=el('a',m?'main':'',t);x.href=h;if(/^http/.test(h)){x.target='_blank';x.rel='noopener'}a.appendChild(x)};
 if(r[12])link('Visit website',r[12],true);else if(r[13])link('Open listing',r[13],false);if(r[21])link(r[21],'tel:'+r[21].replace(/\D/g,''));if(r[22])link(r[22],'mailto:'+r[22]);
 if(r[4]!=null&&!r[6])link('Directions','https://www.openstreetmap.org/?mlat='+r[4]+'&mlon='+r[5]+'#map=16/'+r[4]+'/'+r[5]);B.appendChild(a);
 const g=el('div','glance');g.appendChild(cell('Guests',r[7]?'Up to '+r[7].toLocaleString():''));g.appendChild(cell('Price from',r[9]));g.appendChild(cell('Closes',r[8]));
 g.appendChild(cell('Catering',r[19]));g.appendChild(cell('Alcohol',r[20]));g.appendChild(cell('Outdoor space',r[10]?'Yes':''));B.appendChild(g);
 if(r[25])B.appendChild(el('div','note','A page says this place may be closed, renamed or no longer hosting events.'));
 const wait=el('div','note','Loading details');B.appendChild(wait);
 try{const b=r[0].slice(-2);if(!cache[b])cache[b]=await fetch('data/d/'+b+'.json').then(x=>{if(!x.ok)throw Error(x.status);return x.json()});wait.remove();details(cache[b][r[0]],B)}
 catch(e){wait.textContent='Details could not be loaded ('+e.message+').'}}
function details(d,B){if(!d)return;TOPIC.forEach(([k,title])=>{const fs=d.f[k];if(!fs)return;const s=el('div','sec');const h=el('h3','',title);const b=el('button','srcbtn','Sources');b.onclick=()=>{s.classList.toggle('showsrc');b.textContent=s.classList.contains('showsrc')?'Hide sources':'Sources'};h.appendChild(b);s.appendChild(h);
  const ul=el('ul');fs.forEach(f=>{const li=el('li','',f[0]);const src=el('div','src');if(f[1])src.appendChild(el('div','','“'+f[1]+'”'));const line=el('div');line.appendChild(document.createTextNode(f[3]+(f[2]?': ':'')));
   if(f[2]&&/^https?:/.test(f[2])){const x=el('a','',f[2].replace(/^https?:\/\/(www\.)?/,'').slice(0,60));x.href=f[2];x.target='_blank';x.rel='noopener';line.appendChild(x)}src.appendChild(line);li.appendChild(src);ul.appendChild(li)});s.appendChild(ul);B.appendChild(s)});
 if(d.rooms&&d.rooms.length){const s=el('div','sec');s.appendChild(el('h3','','Rooms and spaces'));const ul=el('ul');d.rooms.forEach(x=>ul.appendChild(el('li','',x)));s.appendChild(ul);B.appendChild(s)}
 B.appendChild(el('div','note','Figures come from public pages and directories. Nothing here is confirmed by the venue; check before relying on it.')).style.marginTop='18px'}
function closeSheet(){$('sheet').classList.remove('open');$('bg').classList.remove('open')}
fetch('data/venues.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(j=>{D=j.rows;$('un').textContent=D.filter(r=>r[24]).length.toLocaleString();
 [...new Set(D.map(r=>r[3]).filter(Boolean))].sort().forEach(c=>$('county').appendChild(el('option','',c)));apply()}).catch(e=>{$('count').textContent='The venue list could not be loaded ('+e.message+')'});
['q','county','minG','late','cater','hp','byo','ho','unnamed'].forEach(i=>$(i).addEventListener('input',apply));
$('reset').onclick=()=>{['q','county','minG','late','cater'].forEach(i=>$(i).value='');['hp','byo','ho','unnamed'].forEach(i=>$(i).checked=false);sortK='rel';asc=true;mark();apply()};
function mark(){document.querySelectorAll('th').forEach(t=>t.classList.toggle('sorted',t.dataset.s===sortK))}
document.querySelectorAll('th[data-s]').forEach(th=>th.onclick=()=>{const k=th.dataset.s;asc=sortK===k?!asc:true;sortK=k;mark();shown.sort(cmp);limit=50;draw()});
$('more').onclick=()=>{limit+=50;draw()};$('close').onclick=closeSheet;$('bg').onclick=closeSheet;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
$('mapbtn').onclick=()=>{const on=document.body.classList.toggle('withmap');$('mapbtn').classList.toggle('on',on);$('mapbtn').textContent=on?'Hide map':'Show map';if(on){try{initMap();setTimeout(()=>{map.invalidateSize();drawMap()},60)}catch(e){}}};
</script>
</body>
</html>
