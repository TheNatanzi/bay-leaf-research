<style>

*{font-style:normal}

.price tr.sub td{border-top:2px solid #5a6072}.price tr.tot td{font-weight:700;font-size:1.1rem;border-top:2px solid #fff}
.price .opt{color:#8f97a8;font-size:.85rem;font-weight:400}.pt .opt{color:#8f97a8;font-size:.9rem}

<body>
<div class="top">
 <div class="bar"><h1>Bay Leaf venues</h1>

  <select id="late" aria-label="Closing time"><option value="">Any closing time</option><option value="1320">Open to 10 PM or later</option><option value="1380">Open to 11 PM or later</option><option value="1440">Open to midnight or later</option></select>
  <select id="cater" aria-label="Catering"><option value="">Any catering</option><option>In-house required</option><option>In-house or outside OK</option><option>Approved caterer list only</option><option>Outside caterer only</option></select>
  <select id="pk" aria-label="Pricing known"><option value="">Any pricing info</option><option value="most">Most key costs known (5+ of 10)</option><option value="some">Some key costs known (2-4)</option><option value="little">1 key cost known</option><option value="zero">No key costs known yet</option></select>

  <button class="btn" id="mapbtn">Show map</button>
 </div>
 <div class="chips">
  <label><input type="checkbox" id="hp"> Price known</label><label><input type="checkbox" id="byo"> BYO allowed</label><label><input type="checkbox" id="ho"> Outdoor space</label><label title="Posts, stories, videos and listings about this venue on other sites"><input type="checkbox" id="sm"> Has posts about it</label>
  <label><input type="checkbox" id="unnamed"> Include <span id="un"></span> unnamed marketplace listings</label>
  <label><input type="checkbox" id="resto"> Show <span id="rn"></span> restaurants with no wedding or 100+ guest evidence</label>

 </div>
</div>
<div class="wrap">
 <div><table class="lst"><thead><tr><th data-s="rel" class="sorted">Venue</th><th data-s="g">Guests</th><th data-s="p">Price from</th><th data-s="c">Closes</th><th data-s="m">Music cutoff</th><th>Catering</th><th>Alcohol</th><th>Outdoor</th><th data-s="k" title="Out of 10 key costs: rent, food, bar, service charge, tax, F&amp;B minimum, overtime, ceremony fee, corkage, rentals">Key costs known</th><th data-s="o">Contact</th></tr></thead><tbody id="tb"></tbody></table>
  <button class="more" id="more">Show more</button></div>
 <div class="mapbox"><div id="map"></div></div>
</div>
<div id="vpage"><div class="vwrap"><button class="back" id="back">← Back to list</button><div id="vbody"></div></div></div>
