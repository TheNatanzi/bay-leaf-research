<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Source evidence | Bay Leaf</title><style>body{font:15px/1.5 system-ui;max-width:850px;margin:30px auto;padding:16px;color:#243b30}article{border-bottom:1px solid #ccc;padding:15px 0}small{color:#667}a{color:#285c47}</style><a href="index.html">← Venue atlas</a><h1>Reviewed source facts</h1><p>Public brochure facts and approved general venue information. Personal correspondence and proposals remain private.</p><div id="facts">No source facts loaded.</div><script>const e=s=>String(s??'Unknown').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('correspondence-evidence.json').then(r=>r.ok?r.json():[]).then(a=>{if(a.length)document.querySelector('#facts').innerHTML=a.map(x=>'<article id="'+e(x.id)+'"><h2>'+e(x.venue)+'</h2><p>'+e(x.field)+': <b>'+e(x.value)+'</b></p><p>'+e(x.conditions)+'</p>'+((x.source_urls||[]).filter(u=>/^https:\/\//.test(u)).map(u=>'<p><a href="'+e(u)+'" target="_blank" rel="noopener">Public source</a></p>').join(''))+'<small>Checked '+e(x.checked_utc)+' · '+e(x.original)+'</small></article>').join('')}).catch(()=>{});</script></html>
